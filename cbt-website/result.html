<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Result</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="result-page">
  <main class="result-card">
    <div class="brand">CBT<span>Pro</span></div>
    <h1>Examination Result</h1>
    <p id="resultStudent" class="muted"></p>

    <div class="score-circle">
      <strong id="score">0%</strong>
      <span>Score</span>
    </div>

    <div class="result-stats">
      <div><strong id="correct">0</strong><span>Correct</span></div>
      <div><strong id="wrong">0</strong><span>Wrong</span></div>
      <div><strong id="total">0</strong><span>Total</span></div>
    </div>

    <p id="remark" class="remark"></p>

    <div class="result-actions">
      <button class="btn primary" onclick="location.href='index.html'">Take Another Test</button>
      <button class="btn secondary" onclick="window.print()">Print Result</button>
    </div>
  </main>
  <script src="js/result.js"></script>
</body>
</html>
